# SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception

name: Continuous Integration Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '6 16 * * 1'

concurrency:
  group: ${{format('{0}:{1}', github.repository, github.ref)}}
  cancel-in-progress: true

jobs:
  beman-submodule-check:
    uses: bemanproject/infra-workflows/.github/workflows/reusable-beman-submodule-check.yml@1.7.3

  preset-test:
    uses: bemanproject/infra-workflows/.github/workflows/reusable-beman-preset-test.yml@1.7.3
    with:
      # Only gcc >= 16 ships <inplace_vector>, which the container requires at
      # C++26. AppleClang, MSVC, and the clang containers (whose libstdc++
      # predates <inplace_vector>, and whose libc++ lacks it) are omitted.
      matrix_config: >
        [
          {"preset": "gcc-debug", "image": "ghcr.io/bemanproject/infra-containers-gcc:latest"},
          {"preset": "gcc-release", "image": "ghcr.io/bemanproject/infra-containers-gcc:latest"}
        ]

  build-and-test:
    uses: bemanproject/infra-workflows/.github/workflows/reusable-beman-build-and-test.yml@1.7.3
    with:
      # Only gcc >= 16 ships std::inplace_vector, which finger_tree5 requires
      # at C++26 (no fallback). The clang CI containers pair clang with a
      # libstdc++ that predates <inplace_vector> (and libc++ lacks it), so
      # clang, AppleClang, MSVC, lower standards, and the C++ modules jobs are
      # all omitted.
      matrix_config: >
        {
          "gcc": [
            { "versions": ["16"],
              "tests": [
                { "cxxversions": ["c++26"],
                  "tests": [
                    { "stdlibs": ["libstdc++"],
                      "tests": [
                        "Debug.Default", "Release.Default", "Release.TSan",
                        "Release.MaxSan", "Debug.Werror", "Debug.Coverage"
                      ]
                    }
                  ]
                }
              ]
            }
          ]
        }

  vcpkg-ci:
    uses: bemanproject/infra-workflows/.github/workflows/reusable-beman-vcpkg-ci.yml@1.7.3
    with:
      port_name: beman-fingertree
      # The modules feature is omitted: the finger-tree headers include many
      # standard headers, which conflict with `import std` in the module
      # interface unit, so the C++ module cannot be built yet.
      feature_combinations: |
        [
          {"features": {}}
        ]

  create-issue-when-fault:
    needs: [preset-test, build-and-test]
    if: failure() && github.event_name == 'schedule'
    uses: bemanproject/infra-workflows/.github/workflows/reusable-beman-create-issue-when-fault.yml@1.7.3
